d" text-anchor="middle" letter-spacing=".4">1</text><text x="255.0" y="131" font-family="IBM Plex Mono,JetBrains Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#e6edf5" text-anchor="middle" letter-spacing=".4">POST /containers/create</text><path d="M388 188H622" stroke="#c9d6e6" stroke-width="1.4" marker-end="url(#a)"/><circle cx="388" cy="188" r="9" fill="#0f1f31" stroke="#7f95ad"/><text x="388" y="192" font-family="IBM Plex Mono,JetBrains Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#7f95ad" text-anchor="middle" letter-spacing=".4">2</text><text x="505.0" y="179" font-family="IBM Plex Mono,JetBrains Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#e6edf5" text-anchor="middle" letter-spacing=".4">AuthZReq (every API call)</text><path d="M622 236H388" stroke="#c9d6e6" stroke-width="1.4" marker-end="url(#a)"/><circle cx="622" cy="236" r="9" fill="#0f1f31" stroke="#7f95ad"/><text x="622" y="240" font-family="IBM Plex Mono,JetBrains Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#7f95ad" text-anchor="middle" letter-spacing=".4">3</text><text x="505.0" y="227" font-family="IBM Plex Mono,JetBrains Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#e6edf5" text-anchor="middle" letter-spacing=".4">inspect image → digest</text><path d="M638 284H862" stroke="#c9d6e6" stroke-width="1.4" marker-end="url(#a)"/><circle cx="638" cy="284" r="9" fill="#0f1f31" stroke="#7f95ad"/><text x="638" y="288" font-family="IBM Plex Mono,JetBrains Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#7f95ad" text-anchor="middle" letter-spacing=".4">4</text><text x="750.0" y="275" font-family="IBM Plex Mono,JetBrains Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#e6edf5" text-anchor="middle" letter-spacing=".4">signatures + attestations</text><path d="M862 332H638" stroke="#7f95ad" stroke-width="1.4" marker-end="url(#a)" stroke-dasharray="5 4"/><circle cx="862" cy="332" r="9" fill="#0f1f31" stroke="#7f95ad"/><text x="862" y="336" font-family="IBM Plex Mono,JetBrains Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#7f95ad" text-anchor="middle" letter-spacing=".4">5</text><text x="750.0" y="323" font-family="IBM Plex Mono,JetBrains Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#e6edf5" text-anchor="middle" letter-spacing=".4">bundles · .sig · .att</text><rect x="512" y="366" width="236" height="52" fill="#0f1f31" stroke="#c9a15a" stroke-width="1.2"/><text x="630" y="386" font-family="IBM Plex Mono,JetBrains Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#c9a15a" text-anchor="middle" letter-spacing=".4">verify with sigstore-go</text><text x="630" y="406" font-family="IBM Plex Mono,JetBrains Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#c9a15a" text-anchor="middle" letter-spacing=".4">cache the verdict</text><path d="M622 450H388" stroke="#c9a15a" stroke-width="1.4" marker-end="url(#ab)"/><circle cx="622" cy="450" r="9" fill="#0f1f31" stroke="#7f95ad"/><text x="622" y="454" font-family="IBM Plex Mono,JetBrains Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#7f95ad" text-anchor="middle" letter-spacing=".4">6</text><text x="505.0" y="441" font-family="IBM Plex Mono,JetBrains Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#c9a15a" text-anchor="middle" letter-spacing=".4">allow, or deny + reason</text><path d="M372 498H138" stroke="#c9d6e6" stroke-width="1.4" marker-end="url(#a)"/><circle cx="372" cy="498" r="9" fill="#0f1f31" stroke="#7f95ad"/><text x="372" y="502" font-family="IBM Plex Mono,JetBrains Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#7f95ad" text-anchor="middle" letter-spacing=".4">7</text><text x="255.0" y="489" font-family="IBM Plex Mono,JetBrains Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#e6edf5" text-anchor="middle" letter-spacing=".4">container, or the denial</text>
