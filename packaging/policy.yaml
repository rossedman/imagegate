# imagegate policy installed by the package. Valid as shipped and in audit
# mode, so it never blocks a container until you edit it and set
# mode: enforce. Reference: https://rossedman.github.io/imagegate/policy/
apiVersion: imagegate.dev/v1
mode: audit

defaults:
  failClosed: true
  verifyTimeout: 10s
  cache:
    allowTTL: 24h
    denyTTL: 60s
  # helpURL: https://rossedman.github.io/imagegate/runbook/

trust:
  sigstore: public-good

identities:
  # Replace with your CI's identity. Keyed alternative:
  #   ci-key:
  #     publicKey: /etc/imagegate/keys/ci.pub
  ci-main:
    issuer: https://token.actions.githubusercontent.com
    subjectRegExp: ^https://github\.com/example-org/.+/\.github/workflows/release\.ya?ml@refs/heads/main$

localImages: deny

rules:
  - name: internal
    images: ["ghcr.io/example-org/**"]
    signature:
      identities: [ci-main]
    sbom:
      identities: [ci-main]
