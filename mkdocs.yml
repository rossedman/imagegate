site_name: imagegate
site_description: Docker authorization plugin that only lets cosign-signed images with signed SBOMs run.
site_url: https://rossedman.github.io/imagegate/
repo_url: https://github.com/rossedman/imagegate
repo_name: rossedman/imagegate
edit_uri: edit/main/docs/
copyright: MIT licensed · imagegate contributors

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: blueprint
      toggle:
        icon: material/weather-sunny
        name: Switch to vellum (light)
    - media: "(prefers-color-scheme: light)"
      scheme: vellum
      toggle:
        icon: material/weather-night
        name: Switch to blueprint (dark)
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - toc:
      permalink: "#"
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Guide:
      - Getting started: getting-started.md
      - How it works: how-it-works.md
      - Signing in CI: signing.md
      - Identities: identities.md
      - Rolling out: rollout.md
  - Reference:
      - Policy: policy.md
      - CLI: cli.md
      - Observability: observability.md
      - Reason codes & runbook: runbook.md
  - Security: security.md
  - Project:
      - Design notes: design.md
      - Contributing: contributing.md
      - Changelog: changelog.md

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rossedman/imagegate
