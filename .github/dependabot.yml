version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      # sigstore moves as a set; keep it separate so a breaking bump there
      # doesn't hold up everything else.
      sigstore:
        patterns: ["github.com/sigstore/*"]
      go-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    commit-message:
      prefix: docs
    groups:
      docs:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /packaging
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      base-images:
        patterns: ["*"]
